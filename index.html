<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昇給・転職が生涯収入に与える影響シミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-teal-950 text-teal-100 min-h-screen">
<div class="max-w-3xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-teal-300 mb-1">💼 生涯収入シミュレーター</h1>
  <p class="text-center text-teal-700 mb-2 text-sm">昇給・転職が生涯収入に与える長期的影響を可視化</p>
  <div class="bg-teal-900/30 border border-teal-700 rounded-lg p-2 mb-4 text-xs text-teal-300 text-center">
    ⚠️ 免責事項: 試算ツールです。実際の収入・税金は個人状況により異なります。ファイナンシャルアドバイザーにご相談ください。
  </div>

  <!-- Settings -->
  <div class="bg-teal-900/40 rounded-xl p-4 mb-4">
    <h2 class="text-sm font-semibold text-teal-200 mb-3">シナリオ設定</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <div>
        <label class="text-xs text-teal-400 block mb-1">現在年齢</label>
        <input type="number" id="age" value="30" min="20" max="60" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">定年年齢</label>
        <input type="number" id="retire" value="65" min="50" max="75" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">現在年収（万円）</label>
        <input type="number" id="current-salary" value="500" min="100" max="10000" step="50" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">年間昇給率（%）</label>
        <input type="number" id="raise-rate" value="2.0" min="0" max="20" step="0.5" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">転職後年収（万円）</label>
        <input type="number" id="new-salary" value="650" min="100" max="10000" step="50" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">転職時年齢</label>
        <input type="number" id="job-change-age" value="35" min="20" max="60" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
    </div>
    <div class="mt-3 grid grid-cols-2 gap-3">
      <div>
        <label class="text-xs text-teal-400 block mb-1">転職後昇給率（%）</label>
        <input type="number" id="new-raise-rate" value="3.0" min="0" max="20" step="0.5" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
      <div>
        <label class="text-xs text-teal-400 block mb-1">貯蓄率（%）</label>
        <input type="number" id="save-rate" value="20" min="0" max="80" class="w-full bg-teal-900 border border-teal-700 rounded-lg px-3 py-2 text-sm text-white" oninput="calculate()">
      </div>
    </div>
  </div>

  <!-- Results -->
  <div id="results" class="bg-teal-900/40 rounded-xl p-4 mb-4"></div>

  <!-- Chart -->
  <div class="bg-teal-900/40 rounded-xl p-4">
    <h2 class="text-sm font-semibold text-teal-200 mb-2">累計収入推移チャート</h2>
    <canvas id="income-chart" width="560" height="180" class="w-full rounded"></canvas>
    <div class="flex gap-4 mt-1 text-xs justify-center">
      <span class="flex items-center gap-1"><span class="inline-block w-4 h-1 bg-teal-400"></span>現職継続</span>
      <span class="flex items-center gap-1"><span class="inline-block w-4 h-1 bg-yellow-400"></span>転職シナリオ</span>
    </div>
  </div>
</div>

<script>
function fmt(n) { return Math.round(n).toLocaleString(); }

function calculate() {
  const age = parseInt(document.getElementById('age').value)||30;
  const retire = parseInt(document.getElementById('retire').value)||65;
  const salary = parseFloat(document.getElementById('current-salary').value)||500;
  const raiseRate = parseFloat(document.getElementById('raise-rate').value)||2;
  const newSalary = parseFloat(document.getElementById('new-salary').value)||650;
  const jobAge = parseInt(document.getElementById('job-change-age').value)||35;
  const newRaiseRate = parseFloat(document.getElementById('new-raise-rate').value)||3;
  const saveRate = parseFloat(document.getElementById('save-rate').value)||20;

  const years = retire - age;

  let currentCumulative = [], jobChangeCumulative = [];
  let totalCurrent = 0, totalJobChange = 0;
  let currentSal = salary, jobSal = salary;

  for (let y = 0; y < years; y++) {
    const yearAge = age + y;

    // Current scenario
    totalCurrent += currentSal;
    currentCumulative.push(totalCurrent);
    currentSal *= (1 + raiseRate/100);

    // Job change scenario
    if (yearAge >= jobAge) {
      if (y === jobAge - age) jobSal = newSalary;
      else jobSal *= (1 + newRaiseRate/100);
    } else {
      jobSal *= (1 + raiseRate/100);
    }
    totalJobChange += jobSal;
    jobChangeCumulative.push(totalJobChange);
  }

  const diff = totalJobChange - totalCurrent;
  const savingsCurrent = totalCurrent * saveRate / 100;
  const savingsJobChange = totalJobChange * saveRate / 100;
  const savingsDiff = savingsDiff2 = savingsJobChange - savingsCurrent;

  document.getElementById('results').innerHTML = `
    <div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3 text-sm">
      <div class="bg-teal-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-teal-400">生涯収入（現職）</div>
        <div class="font-bold text-white">${fmt(totalCurrent)}万円</div>
      </div>
      <div class="bg-yellow-800/30 rounded-lg p-2 text-center">
        <div class="text-xs text-yellow-400">生涯収入（転職後）</div>
        <div class="font-bold text-yellow-200">${fmt(totalJobChange)}万円</div>
      </div>
      <div class="${diff>=0?'bg-green-800/30':'bg-red-800/30'} rounded-lg p-2 text-center">
        <div class="text-xs ${diff>=0?'text-green-400':'text-red-400'}">差額</div>
        <div class="font-bold ${diff>=0?'text-green-300':'text-red-300'}">${diff>=0?'+':''}${fmt(diff)}万円</div>
      </div>
      <div class="bg-teal-800/50 rounded-lg p-2 text-center">
        <div class="text-xs text-teal-400">貯蓄差分（${saveRate}%）</div>
        <div class="font-bold ${savingsDiff>=0?'text-green-300':'text-red-300'}">${savingsDiff>=0?'+':''}${fmt(savingsDiff)}万円</div>
      </div>
    </div>
    <div class="text-xs text-teal-400 space-y-1">
      <div>現職継続: ${age}歳〜${retire}歳（${years}年間）/ 年収${salary}万円から年${raiseRate}%昇給</div>
      <div>転職シナリオ: ${jobAge}歳で${newSalary}万円の職へ転職 / 年${newRaiseRate}%昇給</div>
      <div class="text-teal-500">損益分岐点: ${diff>=0?`転職後約${Math.ceil(Math.abs(newSalary-salary)/salary*100)}年で回収`:'現職継続が生涯収入では有利'}</div>
    </div>
  `;

  drawChart(currentCumulative, jobChangeCumulative, age, retire);
}

function drawChart(current, jobChange, age, retire) {
  const canvas = document.getElementById('income-chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#042f2e'; ctx.fillRect(0,0,W,H);

  const maxVal = Math.max(...current, ...jobChange, 1);
  const n = current.length;
  const toX = i => 30 + (i/n)*(W-50);
  const toY = v => H - 20 - (v/maxVal)*(H-40);

  // Grid
  ctx.strokeStyle='#134e4a'; ctx.lineWidth=0.5;
  for(let i=0;i<=4;i++) {
    const y = 20+i*(H-40)/4;
    ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(W-20,y); ctx.stroke();
    ctx.fillStyle='#5eead4'; ctx.font='9px sans-serif'; ctx.textAlign='right';
    ctx.fillText(fmt(maxVal*(1-i/4))+'万', 28, y+3);
  }

  // Current line
  ctx.strokeStyle='#2dd4bf'; ctx.lineWidth=2;
  ctx.beginPath();
  current.forEach((v,i) => { if(i===0) ctx.moveTo(toX(i),toY(v)); else ctx.lineTo(toX(i),toY(v)); });
  ctx.stroke();

  // Job change line
  ctx.strokeStyle='#fbbf24'; ctx.lineWidth=2;
  ctx.beginPath();
  jobChange.forEach((v,i) => { if(i===0) ctx.moveTo(toX(i),toY(v)); else ctx.lineTo(toX(i),toY(v)); });
  ctx.stroke();

  // Age labels
  const jobChangeYear = parseInt(document.getElementById('job-change-age').value) - age;
  if (jobChangeYear >= 0 && jobChangeYear < n) {
    const jx = toX(jobChangeYear);
    ctx.strokeStyle='#fbbf24'; ctx.lineWidth=1; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(jx,20); ctx.lineTo(jx,H-20); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#fbbf24'; ctx.font='9px sans-serif'; ctx.textAlign='center';
    ctx.fillText('転職', jx, 14);
  }
}

calculate();
</script>
</body>
</html>
